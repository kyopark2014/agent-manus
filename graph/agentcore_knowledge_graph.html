<html lang="ko">
<head>
<meta charset="UTF-8">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d1117; font-family: 'Segoe UI', sans-serif; color: #e6edf3; }

  #header {
    background: linear-gradient(135deg, #161b22 0%, #1c2128 100%);
    border-bottom: 1px solid #30363d;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #header p { font-size: 13px; color: #8b949e; margin-top: 4px; }

  #main { display: flex; height: calc(100vh - 64px); }

  #network-container {
    flex: 1;
    position: relative;
    background: radial-gradient(ellipse at center, #161b22 0%, #0d1117 100%);
  }
  #mynetwork { width: 100%; height: 100%; }

  #sidebar {
    width: 280px;
    background: #161b22;
    border-left: 1px solid #30363d;
    overflow-y: auto;
    padding: 16px;
  }

  .legend-title {
    font-size: 13px;
    font-weight: 700;
    color: #8b949e;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
    margin-top: 16px;
  }
  .legend-title:first-child { margin-top: 0; }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    border-radius: 6px;
    margin-bottom: 4px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .legend-item:hover { background: #21262d; }
  .legend-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .legend-label { font-size: 13px; color: #e6edf3; }
  .legend-count {
    margin-left: auto;
    font-size: 11px;
    color: #6e7681;
    background: #21262d;
    padding: 1px 6px;
    border-radius: 10px;
  }

  #node-detail {
    background: #21262d;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 14px;
    margin-top: 16px;
    display: none;
  }
  #node-detail h3 { font-size: 14px; font-weight: 600; color: #FF6B35; margin-bottom: 8px; }
  #node-detail p { font-size: 12px; color: #8b949e; line-height: 1.5; }
  #node-detail .node-type {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    margin-bottom: 6px;
  }

  .controls {
    position: absolute;
    bottom: 20px;
    left: 20px;
    display: flex;
    gap: 8px;
  }
  .ctrl-btn {
    background: #21262d;
    border: 1px solid #30363d;
    color: #e6edf3;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.2s;
  }
  .ctrl-btn:hover { background: #30363d; border-color: #FF6B35; }

  .stats-bar {
    position: absolute;
    top: 16px;
    left: 16px;
    display: flex;
    gap: 12px;
  }
  .stat-chip {
    background: rgba(33,38,45,0.9);
    border: 1px solid #30363d;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    color: #8b949e;
  }
  .stat-chip span { color: #FF6B35; font-weight: 700; }
</style>
</head>
<body>

<div id="header">
  <div>
    <h1>🤖 Amazon Bedrock AgentCore Knowledge Graph</h1>
    <p>graphify로 추출된 지식 그래프 · 노드를 클릭하면 상세 정보를 확인할 수 있습니다</p>
  </div>

g_trace", "label": "Bedrock\nRouting Trace", "group": "bedrock", "size": 20, "color": "#DDA0DD"}, {"id": "bedrock_mcp", "label": "Bedrock Agent\nMCP 통합", "group": "bedrock", "size": 25, "color": "#DDA0DD"}, {"id": "mcp_gateway", "label": "MCP Gateway", "group": "mcp", "size": 25, "color": "#FFD93D"}, {"id": "mcp_rag", "label": "MCP 기반\nRAG 구현", "group": "mcp", "size": 22, "color": "#FFD93D"}, {"id": "mcp_kb", "label": "Amazon KB\nMCP 서버", "group": "mcp", "size": 20, "color": "#FFD93D"}, {"id": "mcp_cost", "label": "AWS Cost\nAnalysis MCP", "group": "mcp", "size": 18, "color": "#FFD93D"}, {"id": "mcp_kb_retrieval", "label": "AWS KB Retrieval\nMCP 서버", "group": "mcp", "size": 18, "color": "#FFD93D"}, {"id": "langgraph_adapter", "label": "LangGraph\nMCP Adapter", "group": "mcp", "size": 18, "color": "#FFD93D"}, {"id": "planning_agent", "label": "Planning 패턴\nAgent 평가", "group": "evaluation", "size": 22, "color": "#F7B2B7"}, {"id": "csat_claude", "label": "Claude 3.5 Sonnet\nCSAT 93점", "group": "evaluation", "size": 18, "color": "#F7B2B7"}, {"id": "csat_nova", "label": "Nova Pro\nCSAT 84점", "group": "evaluation", "size": 18, "color": "#F7B2B7"}, {"id": "manus_agent", "label": "Manus Planning\n+ Multi-Agent", "group": "evaluation", "size": 20, "color": "#F7B2B7"}, {"id": "strands_eks", "label": "Strands Agent\nMCP EKS 배포", "group": "infra", "size": 22, "color": "#C8E6C9"}, {"id": "eks_streamlit", "label": "EKS Streamlit\n배포 태스크", "group": "infra", "size": 18, "color": "#C8E6C9"}, {"id": "streamlit_bedrock", "label": "Streamlit\nBedrock 챗봇", "group": "infra", "size": 20, "color": "#C8E6C9"}, {"id": "cloudwatch", "label": "CloudWatch\nAgent 설치", "group": "infra", "size": 18, "color": "#C8E6C9"}, {"id": "agentic_seminar", "label": "Agentic AI\n세미나 발표", "group": "other", "size": 18, "color": "#B0BEC5"}, {"id": "institutional_memory", "label": "기관 기억\n(Institutional Memory)", "group": "other", "size": 20, "color": "#B0BEC5"}];

function darkenColor(hex, factor) {
  const r = Math.floor(parseInt(hex.slice(1,3), 16) * (1-factor));
  const g = Math.floor(parseInt(hex.slice(3,5), 16) * (1-factor));
  const b = Math.floor(parseInt(hex.slice(5,7), 16) * (1-factor));
  return `rgb(${r},${g},${b})`;
}
function lightenColor(hex, factor) {
  const r = Math.min(255, Math.floor(parseInt(hex.slice(1,3), 16) + 255 * factor));
  const g = Math.min(255, Math.floor(parseInt(hex.slice(3,5), 16) + 255 * factor));
  const b = Math.min(255, Math.floor(parseInt(hex.slice(5,7), 16) + 255 * factor));
  return `rgb(${r},${g},${b})`;
}

const container = document.getElementById('mynetwork');
const networkData = {
  nodes: new vis.DataSet(visNodes),
  edges: new vis.DataSet(visEdges)
};

const options = {
  physics: {
    enabled: true,
    solver: 'forceAtlas2Based',
    forceAtlas2Based: {
      gravitationalConstant: -120,
      centralGravity: 0.015,
      springLength: 160,
      springConstant: 0.06,
      damping: 0.5,
      avoidOverlap: 0.8
    },
    stabilization: {
      enabled: true,
      iterations: 200,
      updateInterval: 25,
    }
  },
  interaction: {
    hover: true,
    tooltipDelay: 200,
    zoomView: true,
    dragView: true,
    navigationButtons: false,
    keyboard: { enabled: true, bindToWindow: false }
  },
  layout: {
    improvedLayout: true,
    hierarchical: { enabled: false }
  },
};

const network = new vis.Network(container, networkData, options);

// 노드 클릭 이벤트
network.on("click", function(params) {
  if (params.nodes.length > 0) {
    const nodeId = params.nodes[0];
    const node = rawNodes.find(n => n.id === nodeId);
    const detail = document.getElementById('node-detail');
    const typeEl = document.getElementById('detail-type');
    const titleEl = document.getElementById('detail-title');
    const descEl = document.getElementById('detail-desc');

    const groupNames = {
      core: '🔶 Core', service: '🔷 서비스', payment_detail: '💳 Payments',
      payment_provider: '🏦 결제 제공자', bedrock: '🟣 Bedrock',
      mcp: '🟡 MCP', evaluation: '📊 평가', infra: '🟢 인프라', other: '⚪ 기타'
    };
    const groupColors2 = {
      core: '#FF6B35', service: '#4ECDC4', payment_detail: '#45B7D1',
      payment_provider: '#96CEB4', bedrock: '#DDA0DD', mcp: '#FFD93D',
      evaluation: '#F7B2B7', infra: '#C8E6C9', other: '#B0BEC5'
    };

    typeEl.textContent = groupNames[node.group] || node.group;
    typeEl.style.background = groupColors2[node.group] + '33';
    typeEl.style.color = groupColors2[node.group];
    typeEl.style.border = `1px solid ${groupColors2[node.group]}66`;

    titleEl.textContent = node.label.replace(/\n/g, ' ');
    descEl.textContent = nodeDescriptions[nodeId] || '관련 설명이 없습니다.';
    detail.style.display = 'block';
  }
});

network.on("hoverNode", function() {
  container.style.cursor = 'pointer';
});
network.on("blurNode", function() {
  container.style.cursor = 'default';
});

// 안정화 후 중앙 노드 강조
network.once("stabilizationIterationsDone", function() {
  network.focus('agentcore', { scale: 0.9, animation: { duration: 1000 } });
});

function filterGroup(group) {
  if (!group) {
    networkData.nodes.update(rawNodes.map(n => ({ id: n.id, hidden: false })));
    return;
  }
  networkData.nodes.update(rawNodes.map(n => ({
    id: n.id,
    hidden: n.group !== group && n.id !== 'agentcore',
    opacity: n.group === group || n.id === 'agentcore' ? 1 : 0.15
  })));
}

function stabilize() {
  network.startSimulation();
  setTimeout(() => { network.stopSimulation(); network.fit(); }, 2000);
}
</script>
</body>
